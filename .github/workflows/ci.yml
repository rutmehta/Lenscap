name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Assemble .app + embed Sparkle
        run: bash Scripts/make-app.sh
      - name: Verify code signature (deep, strict)
        run: codesign --verify --deep --strict dist/Lenscap.app
